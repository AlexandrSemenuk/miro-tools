<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SSOT Sync</title>
  <script src="https://miro.com/app/static/sdk/v2/miro.js"></script>
</head>
<body>
<script>
  const APPDATA_KEY = 'portfolio_ssot_v61';
  const ONTOLOGY_FRAME_NAME = 'ontology';
  const DECOMPOSITION_MARKER = 'decomposition';
  const IGNORE_PREFIX = '_';
  const MAX_ALIASES = 50;
  const APPDATA_SOFT_LIMIT_BYTES = 28000;
  const UPDATE_BATCH_SIZE = 20;

  let syncInProgress = false;
  let rerunRequested = false;

  function plainText(content) {
    const div = document.createElement('div');
    div.innerHTML = content ?? '';
    return (div.textContent ?? '').replace(/\s+/g, ' ').trim();
  }

  function ignored(item) {
    const text = plainText(item.content);
    return !text || text.startsWith(IGNORE_PREFIX);
  }

  function emptyState() {
    return { v: 61, s: {}, r: {} };
  }

  function normalizeAliases(values, currentText) {
    const out = [];
    const seen = new Set();

    for (const raw of values ?? []) {
      const text = String(raw ?? '').replace(/\s+/g, ' ').trim();
      if (!text || text === currentText || seen.has(text)) continue;
      seen.add(text);
      out.push(text);
    }

    return out.slice(-MAX_ALIASES);
  }

  async function loadState() {
    const raw = await miro.board.getAppData(APPDATA_KEY);
    if (!raw || raw.v !== 61 || typeof raw !== 'object') return emptyState();

    return {
      v: 61,
      s: raw.s && typeof raw.s === 'object' ? raw.s : {},
      r: raw.r && typeof raw.r === 'object' ? raw.r : {}
    };
  }

  async function saveState(state) {
    const bytes = new TextEncoder().encode(JSON.stringify(state)).length;
    if (bytes > APPDATA_SOFT_LIMIT_BYTES) {
      throw new Error(`SSOT state is too large: ${bytes} bytes`);
    }
    await miro.board.setAppData(APPDATA_KEY, state);
    return bytes;
  }

  async function getFrames() {
    const frames = await miro.board.get({ type: 'frame' });

    const ontology = frames.find(
      f => (f.title ?? '').trim().toLowerCase() === ONTOLOGY_FRAME_NAME
    );
    if (!ontology) throw new Error('Ontology frame not found');

    const decomposition = frames.filter(f =>
      f.id !== ontology.id &&
      (f.title ?? '').toLowerCase().includes(DECOMPOSITION_MARKER)
    );

    if (!decomposition.length) {
      throw new Error('No frames with "Decomposition" in the title were found');
    }

    return { ontology, decomposition };
  }

  async function collectShapes(rootFrames) {
    const shapes = new Map();
    const queue = [...rootFrames];
    const visited = new Set();

    while (queue.length) {
      const frame = queue.shift();
      if (!frame || visited.has(frame.id)) continue;
      visited.add(frame.id);

      const children = await frame.getChildren();
      for (const child of children) {
        if (child.type === 'shape') shapes.set(child.id, child);
        else if (child.type === 'frame') queue.push(child);
      }
    }

    return shapes;
  }

  function registerSources(ontologyShapes, state) {
    const active = new Map();
    const ontologyIds = new Set(ontologyShapes.keys());
    let renamed = 0;
    let newSources = 0;
    let ignoredSources = 0;

    for (const sourceId of Object.keys(state.s)) {
      if (!ontologyIds.has(sourceId)) {
        delete state.s[sourceId];
        delete state.r[sourceId];
      }
    }

    for (const source of ontologyShapes.values()) {
      const currentText = plainText(source.content);
      if (!currentText || currentText.startsWith(IGNORE_PREFIX)) {
        ignoredSources++;
        continue;
      }

      const existing = state.s[source.id];
      const aliases = Array.isArray(existing?.a) ? [...existing.a] : [];
      const previousText = String(existing?.t ?? '').trim();

      if (!existing) {
        newSources++;
      } else if (previousText && previousText !== currentText) {
        aliases.push(previousText);
        renamed++;
      }

      state.s[source.id] = {
        t: currentText,
        a: normalizeAliases(aliases, currentText)
      };
      state.r[source.id] = Array.isArray(state.r[source.id]) ? state.r[source.id] : [];

      active.set(source.id, {
        item: source,
        currentText,
        aliases: state.s[source.id].a
      });
    }

    return { active, renamed, newSources, ignoredSources };
  }

  function buildTextIndex(activeSources) {
    const index = new Map();

    function add(text, sourceId) {
      if (!text) return;
      const set = index.get(text) ?? new Set();
      set.add(sourceId);
      index.set(text, set);
    }

    for (const [sourceId, src] of activeSources) {
      add(src.currentText, sourceId);
      for (const alias of src.aliases) add(alias, sourceId);
    }

    return index;
  }

  function sanitizeLinks(state, scopedShapes) {
    const activeRefIds = new Set();
    const refToSource = new Map();
    let pruned = 0;
    let duplicates = 0;

    for (const item of scopedShapes.values()) {
      if (!ignored(item)) activeRefIds.add(item.id);
    }

    for (const [sourceId, refsRaw] of Object.entries(state.r)) {
      if (!state.s[sourceId]) {
        delete state.r[sourceId];
        continue;
      }

      const kept = [];
      for (const refId of Array.isArray(refsRaw) ? refsRaw : []) {
        if (!activeRefIds.has(refId)) {
          pruned++;
          continue;
        }
        if (refToSource.has(refId)) {
          duplicates++;
          continue;
        }

        refToSource.set(refId, sourceId);
        kept.push(refId);
      }
      state.r[sourceId] = kept;
    }

    return { refToSource, pruned, duplicates };
  }

  function discoverLinks(scopedShapes, activeSources, state, refToSource) {
    const textIndex = buildTextIndex(activeSources);
    let newLinks = 0;
    let ambiguous = 0;

    for (const item of scopedShapes.values()) {
      if (ignored(item) || refToSource.has(item.id)) continue;

      const candidates = [...(textIndex.get(plainText(item.content)) ?? [])];
      if (candidates.length === 1) {
        const sourceId = candidates[0];
        state.r[sourceId].push(item.id);
        refToSource.set(item.id, sourceId);
        newLinks++;
      } else if (candidates.length > 1) {
        ambiguous++;
      }
    }

    return { newLinks, ambiguous };
  }

  function buildUpdates(scopedShapes, activeSources, refToSource) {
    const updates = [];

    for (const [refId, sourceId] of refToSource) {
      const reference = scopedShapes.get(refId);
      const source = activeSources.get(sourceId);
      if (!reference || !source) continue;

      if (reference.content !== source.item.content) {
        updates.push({ reference, source: source.item });
      }
    }

    return updates;
  }

  async function applyUpdates(updates) {
    let updated = 0;

    for (let i = 0; i < updates.length; i += UPDATE_BATCH_SIZE) {
      const batch = updates.slice(i, i + UPDATE_BATCH_SIZE);
      await Promise.all(batch.map(async ({ reference, source }) => {
        reference.content = source.content;
        await reference.sync();
      }));
      updated += batch.length;
    }

    return updated;
  }

  function referenceCount(state) {
    return Object.values(state.r).reduce(
      (sum, refs) => sum + (Array.isArray(refs) ? refs.length : 0),
      0
    );
  }

  async function syncOnce() {
    await miro.board.notifications.showInfo('SSOT Sync started');

    const state = await loadState();
    const { ontology, decomposition } = await getFrames();

    const [ontologyShapes, scopedShapes] = await Promise.all([
      collectShapes([ontology]),
      collectShapes(decomposition)
    ]);

    const sourceResult = registerSources(ontologyShapes, state);
    const linkResult = sanitizeLinks(state, scopedShapes);
    const discoveryResult = discoverLinks(
      scopedShapes,
      sourceResult.active,
      state,
      linkResult.refToSource
    );

    const updates = buildUpdates(
      scopedShapes,
      sourceResult.active,
      linkResult.refToSource
    );

    const stateBytes = await saveState(state);
    const updated = await applyUpdates(updates);

    let message =
      `SSOT Sync · Sources: ${sourceResult.active.size}` +
      ` · References: ${referenceCount(state)}` +
      ` · New: ${discoveryResult.newLinks}` +
      ` · Updated: ${updated}` +
      ` · Frames: ${decomposition.length}`;

    if (sourceResult.renamed) message += ` · Renamed: ${sourceResult.renamed}`;
    if (sourceResult.ignoredSources) message += ` · Ignored _: ${sourceResult.ignoredSources}`;
    if (discoveryResult.ambiguous) message += ` · Ambiguous: ${discoveryResult.ambiguous}`;
    if (linkResult.pruned) message += ` · Pruned: ${linkResult.pruned}`;
    if (linkResult.duplicates) message += ` · Duplicates fixed: ${linkResult.duplicates}`;
    message += ` · State: ${Math.ceil(stateBytes / 1024)} KB`;

    await miro.board.notifications.showInfo(message);
  }

  async function handleSyncClick() {
    if (syncInProgress) {
      rerunRequested = true;
      await miro.board.notifications.showInfo(
        'SSOT Sync already running · one rerun queued'
      );
      return;
    }

    syncInProgress = true;
    try {
      do {
        rerunRequested = false;
        await syncOnce();
      } while (rerunRequested);
    } catch (error) {
      console.error('SSOT Sync failed:', error);
      await miro.board.notifications.showError(
        `SSOT Sync failed: ${error.message ?? 'Unknown error'}`
      );
    } finally {
      syncInProgress = false;
    }
  }

  async function init() {
    await miro.board.ui.on('icon:click', handleSyncClick);
  }

  init();
</script>
</body>
</html>
