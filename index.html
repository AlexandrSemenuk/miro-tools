<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SSOT Sync</title>
  <script src="https://miro.com/app/static/sdk/v2/miro.js"></script>
</head>
<body>
<script>
  const SSOT_KEY = 'portfolio_ssot';
  const ONTOLOGY_FRAME_NAME = 'ontology';
  const IGNORE_PREFIX = '_';
  const MAX_ALIASES = 50;

  function plainText(content) {
    const div = document.createElement('div');
    div.innerHTML = content ?? '';
    return (div.textContent ?? '').replace(/\s+/g, ' ').trim();
  }

  function isIgnored(item) {
    const text = plainText(item.content);
    return !text || text.startsWith(IGNORE_PREFIX);
  }

  function createEntityId(source) {
    return `ssot_${source.id}`;
  }

  function normalizeAliases(rawAliases, currentText, previousText) {
    const aliases = Array.isArray(rawAliases) ? rawAliases.filter(Boolean) : [];

    if (previousText && previousText !== currentText) {
      aliases.push(previousText);
    }

    const unique = [];
    const seen = new Set();

    for (const value of aliases) {
      const text = String(value).replace(/\s+/g, ' ').trim();
      if (!text || text === currentText || seen.has(text)) continue;
      seen.add(text);
      unique.push(text);
    }

    return unique.slice(-MAX_ALIASES);
  }

  async function findOntologyFrame() {
    const frames = await miro.board.get({ type: 'frame' });

    const exact = frames.find(
      item => (item.title ?? '').trim().toLowerCase() === ONTOLOGY_FRAME_NAME
    );
    if (exact) return exact;

    for (const frame of frames) {
      const children = await frame.getChildren();
      const hasLabel = children.some(item => {
        if (item.type !== 'shape' && item.type !== 'text') return false;
        return plainText(item.content).toLowerCase() === ONTOLOGY_FRAME_NAME;
      });
      if (hasLabel) return frame;
    }

    throw new Error('Ontology frame not found');
  }

  async function registerSources(ontologyShapes) {
    const byEntityId = new Map();
    const byLegacyEntityId = new Map();
    const byItemId = new Map();
    let registered = 0;
    let ignored = 0;
    let renamedSources = 0;
    let clonedSourcesReset = 0;

    for (const source of ontologyShapes) {
      if (isIgnored(source)) {
        ignored++;
        continue;
      }

      const currentText = plainText(source.content);
      const currentMeta = await source.getMetadata(SSOT_KEY);
      const entityId = createEntityId(source);

      // If a canonical source was created by copying another canonical source,
      // Miro may also copy app metadata. Do not inherit the original source's
      // identity or rename history.
      const isClonedSource =
        currentMeta?.source_item_id && currentMeta.source_item_id !== source.id;

      if (isClonedSource) clonedSourcesReset++;

      const previousText = isClonedSource ? null : currentMeta?.last_text;
      const previousAliases = isClonedSource ? [] : currentMeta?.aliases;
      const aliases = normalizeAliases(
        previousAliases,
        currentText,
        previousText
      );

      if (previousText && previousText !== currentText) {
        renamedSources++;
      }

      const sourceEntry = {
        item: source,
        entityId,
        currentText,
        aliases
      };

      // Migration path for older v3/v4 references that only know the old
      // entity_id. Do not register copied foreign source metadata as legacy.
      if (currentMeta?.entity_id && !isClonedSource) {
        byLegacyEntityId.set(currentMeta.entity_id, sourceEntry);
      }

      await source.setMetadata(SSOT_KEY, {
        entity_id: entityId,
        source_item_id: source.id,
        field: 'content',
        role: 'source',
        last_text: currentText,
        aliases
      });

      byEntityId.set(entityId, sourceEntry);
      byItemId.set(source.id, sourceEntry);
      registered++;
    }

    return {
      byEntityId,
      byLegacyEntityId,
      byItemId,
      registered,
      ignored,
      renamedSources,
      clonedSourcesReset
    };
  }

  function buildSourcesByKnownText(sourceRegistry) {
    const result = new Map();

    function add(text, sourceEntry) {
      if (!text) return;
      const list = result.get(text) ?? [];
      list.push(sourceEntry);
      result.set(text, list);
    }

    for (const sourceEntry of sourceRegistry.byItemId.values()) {
      add(sourceEntry.currentText, sourceEntry);
      for (const alias of sourceEntry.aliases) add(alias, sourceEntry);
    }

    return result;
  }

  async function discoverReferences(allShapes, ontologyShapeIds, sourceRegistry) {
    const sourcesByKnownText = buildSourcesByKnownText(sourceRegistry);
    const links = [];

    let newLinks = 0;
    let repairedLinks = 0;
    let recoveredByAlias = 0;
    let ambiguous = 0;
    let orphans = 0;

    for (const item of allShapes) {
      if (ontologyShapeIds.has(item.id)) continue;
      if (isIgnored(item)) continue;

      const meta = await item.getMetadata(SSOT_KEY);
      let sourceEntry = null;
      let matchedByText = false;

      if (meta?.source_item_id) {
        sourceEntry = sourceRegistry.byItemId.get(meta.source_item_id) ?? null;
      }

      if (!sourceEntry && meta?.entity_id) {
        sourceEntry =
          sourceRegistry.byEntityId.get(meta.entity_id) ??
          sourceRegistry.byLegacyEntityId.get(meta.entity_id) ??
          null;
      }

      // Recovery/discovery path. Uses both current canonical name and aliases.
      if (!sourceEntry) {
        const text = plainText(item.content);
        const candidates = sourcesByKnownText.get(text) ?? [];

        if (candidates.length === 1) {
          sourceEntry = candidates[0];
          matchedByText = true;

          const isHistoricalName = text !== sourceEntry.currentText;
          if (isHistoricalName) recoveredByAlias++;

          if (meta?.entity_id || meta?.source_item_id) repairedLinks++;
          else newLinks++;
        } else if (candidates.length > 1) {
          ambiguous++;
          continue;
        } else {
          if (meta?.entity_id || meta?.source_item_id) orphans++;
          continue;
        }
      }

      await item.setMetadata(SSOT_KEY, {
        entity_id: sourceEntry.entityId,
        source_item_id: sourceEntry.item.id,
        field: 'content',
        role: 'reference'
      });

      links.push({
        referenceId: item.id,
        sourceId: sourceEntry.item.id,
        entityId: sourceEntry.entityId,
        matchedByText
      });
    }

    return {
      links,
      newLinks,
      repairedLinks,
      recoveredByAlias,
      ambiguous,
      orphans
    };
  }

  async function syncBoundReferences(links) {
    const freshShapes = await miro.board.get({ type: 'shape' });
    const byId = new Map(freshShapes.map(item => [item.id, item]));

    let updated = 0;
    let missing = 0;

    for (const link of links) {
      const reference = byId.get(link.referenceId);
      const source = byId.get(link.sourceId);

      if (!reference || !source) {
        missing++;
        continue;
      }

      if (reference.content !== source.content) {
        reference.content = source.content;
        await reference.sync();
        updated++;
      }

      await reference.setMetadata(SSOT_KEY, {
        entity_id: link.entityId,
        source_item_id: link.sourceId,
        field: 'content',
        role: 'reference'
      });
    }

    return { updated, missing };
  }

  async function syncAll() {
    const ontologyFrame = await findOntologyFrame();
    const ontologyChildren = await ontologyFrame.getChildren();
    const ontologyShapes = ontologyChildren.filter(item => item.type === 'shape');
    const ontologyShapeIds = new Set(ontologyShapes.map(item => item.id));

    const sourceRegistry = await registerSources(ontologyShapes);
    const allShapes = await miro.board.get({ type: 'shape' });

    const referenceResult = await discoverReferences(
      allShapes,
      ontologyShapeIds,
      sourceRegistry
    );

    const syncResult = await syncBoundReferences(referenceResult.links);

    let message =
      `SSOT Sync · Sources: ${sourceRegistry.registered}` +
      ` · References: ${referenceResult.links.length}` +
      ` · New links: ${referenceResult.newLinks}` +
      ` · Updated: ${syncResult.updated}`;

    if (referenceResult.recoveredByAlias) {
      message += ` · Recovered: ${referenceResult.recoveredByAlias}`;
    }
    if (referenceResult.repairedLinks) {
      message += ` · Repaired: ${referenceResult.repairedLinks}`;
    }
    if (sourceRegistry.clonedSourcesReset) {
      message += ` · Source clones reset: ${sourceRegistry.clonedSourcesReset}`;
    }
    if (sourceRegistry.ignored) {
      message += ` · Ignored _: ${sourceRegistry.ignored}`;
    }
    if (referenceResult.ambiguous) {
      message += ` · Ambiguous: ${referenceResult.ambiguous}`;
    }
    if (referenceResult.orphans) {
      message += ` · Orphans: ${referenceResult.orphans}`;
    }
    if (syncResult.missing) {
      message += ` · Missing items: ${syncResult.missing}`;
    }

    await miro.board.notifications.showInfo(message);
  }

  async function init() {
    await miro.board.ui.on('icon:click', async () => {
      try {
        await syncAll();
      } catch (error) {
        console.error('SSOT Sync failed:', error);
        await miro.board.notifications.showError(
          `SSOT Sync failed: ${error.message ?? 'Unknown error'}`
        );
      }
    });
  }

  init();
</script>
</body>
</html>
