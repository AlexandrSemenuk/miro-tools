<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SSOT Sync</title>
  <script src="https://miro.com/app/static/sdk/v2/miro.js"></script>
</head>
<body>
<script>
  const SSOT_KEY = 'portfolio_ssot';
  const ONTOLOGY_FRAME_NAME = 'ontology';
  const IGNORE_PREFIX = '_';

  function plainText(content) {
    const div = document.createElement('div');
    div.innerHTML = content ?? '';
    return (div.textContent ?? '').replace(/\s+/g, ' ').trim();
  }

  function isIgnored(item) {
    const text = plainText(item.content);
    return !text || text.startsWith(IGNORE_PREFIX);
  }

  function createEntityId(source) {
    // Canonical Miro item id is stable across renames, so it is the safest seed.
    return `ssot_${source.id}`;
  }

  async function findOntologyFrame() {
    const frames = await miro.board.get({ type: 'frame' });

    const exact = frames.find(
      item => (item.title ?? '').trim().toLowerCase() === ONTOLOGY_FRAME_NAME
    );
    if (exact) return exact;

    for (const frame of frames) {
      const children = await frame.getChildren();
      const hasLabel = children.some(item => {
        if (item.type !== 'shape' && item.type !== 'text') return false;
        return plainText(item.content).toLowerCase() === ONTOLOGY_FRAME_NAME;
      });
      if (hasLabel) return frame;
    }

    throw new Error('Ontology frame not found');
  }

  async function registerSources(ontologyShapes) {
    const byEntityId = new Map();
    const byItemId = new Map();
    let registered = 0;
    let ignored = 0;

    for (const source of ontologyShapes) {
      if (isIgnored(source)) {
        ignored++;
        continue;
      }

      const currentMeta = await source.getMetadata(SSOT_KEY);
      const entityId = currentMeta?.entity_id || createEntityId(source);

      // Canonical source metadata is reaffirmed every run, but the id is never
      // changed just because the visible text changes.
      await source.setMetadata(SSOT_KEY, {
        entity_id: entityId,
        source_item_id: source.id,
        field: 'content',
        role: 'source'
      });

      byEntityId.set(entityId, source);
      byItemId.set(source.id, source);
      registered++;
    }

    return { byEntityId, byItemId, registered, ignored };
  }

  function buildSourcesByText(byItemId) {
    const result = new Map();

    for (const source of byItemId.values()) {
      const text = plainText(source.content);
      if (!text) continue;

      const list = result.get(text) ?? [];
      list.push(source);
      result.set(text, list);
    }

    return result;
  }

  async function discoverReferences(allShapes, ontologyShapeIds, sourceRegistry) {
    const sourcesByText = buildSourcesByText(sourceRegistry.byItemId);
    const links = [];

    let newLinks = 0;
    let repairedLinks = 0;
    let ambiguous = 0;
    let orphans = 0;

    for (const item of allShapes) {
      if (ontologyShapeIds.has(item.id)) continue;
      if (isIgnored(item)) continue;

      const meta = await item.getMetadata(SSOT_KEY);
      let source = null;

      // 1) Strongest relationship: direct canonical item id.
      if (meta?.source_item_id) {
        source = sourceRegistry.byItemId.get(meta.source_item_id) ?? null;
      }

      // 2) Backward compatibility with v3/v4 entity_id-only metadata.
      if (!source && meta?.entity_id) {
        source = sourceRegistry.byEntityId.get(meta.entity_id) ?? null;
      }

      // 3) Discovery is text-based ONLY for an unbound/broken reference.
      if (!source) {
        const candidates = sourcesByText.get(plainText(item.content)) ?? [];

        if (candidates.length === 1) {
          source = candidates[0];
          if (meta?.entity_id || meta?.source_item_id) repairedLinks++;
          else newLinks++;
        } else if (candidates.length > 1) {
          ambiguous++;
          continue;
        } else {
          if (meta?.entity_id || meta?.source_item_id) orphans++;
          continue;
        }
      }

      const sourceMeta = await source.getMetadata(SSOT_KEY);
      const entityId = sourceMeta?.entity_id || createEntityId(source);

      // Reaffirm reference metadata every run. Visible text never decides an
      // already-bound relationship after this point.
      await item.setMetadata(SSOT_KEY, {
        entity_id: entityId,
        source_item_id: source.id,
        field: 'content',
        role: 'reference'
      });

      links.push({ referenceId: item.id, sourceId: source.id, entityId });
    }

    return { links, newLinks, repairedLinks, ambiguous, orphans };
  }

  async function syncBoundReferences(links) {
    // Re-read shapes after all metadata writes so synchronization works with
    // fresh board objects rather than stale instances from discovery.
    const freshShapes = await miro.board.get({ type: 'shape' });
    const byId = new Map(freshShapes.map(item => [item.id, item]));

    let updated = 0;
    let missing = 0;

    for (const link of links) {
      const reference = byId.get(link.referenceId);
      const source = byId.get(link.sourceId);

      if (!reference || !source) {
        missing++;
        continue;
      }

      if (reference.content !== source.content) {
        reference.content = source.content;
        await reference.sync();
        updated++;
      }

      // Defensive: keep the relationship explicitly persisted after sync().
      await reference.setMetadata(SSOT_KEY, {
        entity_id: link.entityId,
        source_item_id: link.sourceId,
        field: 'content',
        role: 'reference'
      });
    }

    return { updated, missing };
  }

  async function syncAll() {
    const ontologyFrame = await findOntologyFrame();
    const ontologyChildren = await ontologyFrame.getChildren();
    const ontologyShapes = ontologyChildren.filter(item => item.type === 'shape');
    const ontologyShapeIds = new Set(ontologyShapes.map(item => item.id));

    const sourceRegistry = await registerSources(ontologyShapes);
    const allShapes = await miro.board.get({ type: 'shape' });

    const referenceResult = await discoverReferences(
      allShapes,
      ontologyShapeIds,
      sourceRegistry
    );

    const syncResult = await syncBoundReferences(referenceResult.links);

    let message =
      `SSOT Sync · Sources: ${sourceRegistry.registered}` +
      ` · References: ${referenceResult.links.length}` +
      ` · New links: ${referenceResult.newLinks}` +
      ` · Updated: ${syncResult.updated}`;

    if (referenceResult.repairedLinks) {
      message += ` · Repaired: ${referenceResult.repairedLinks}`;
    }
    if (sourceRegistry.ignored) {
      message += ` · Ignored _: ${sourceRegistry.ignored}`;
    }
    if (referenceResult.ambiguous) {
      message += ` · Ambiguous: ${referenceResult.ambiguous}`;
    }
    if (referenceResult.orphans) {
      message += ` · Orphans: ${referenceResult.orphans}`;
    }
    if (syncResult.missing) {
      message += ` · Missing items: ${syncResult.missing}`;
    }

    await miro.board.notifications.showInfo(message);
  }

  async function init() {
    await miro.board.ui.on('icon:click', async () => {
      try {
        await syncAll();
      } catch (error) {
        console.error('SSOT Sync failed:', error);
        await miro.board.notifications.showError(
          `SSOT Sync failed: ${error.message ?? 'Unknown error'}`
        );
      }
    });
  }

  init();
</script>
</body>
</html>
