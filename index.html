<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SSOT Sync</title>
  <script src="https://miro.com/app/static/sdk/v2/miro.js"></script>
</head>
<body>
<script>
  const SSOT_KEY = 'portfolio_ssot';
  const ONTOLOGY_FRAME_NAME = 'ontology';
  const IGNORE_PREFIX = '_';

  function plainText(content) {
    const div = document.createElement('div');
    div.innerHTML = content ?? '';
    return (div.textContent ?? '').replace(/\s+/g, ' ').trim();
  }

  function isEmpty(item) {
    return plainText(item.content).length === 0;
  }

  function hasIgnorePrefix(item) {
    return plainText(item.content).startsWith(IGNORE_PREFIX);
  }

  function createEntityId() {
    if (globalThis.crypto?.randomUUID) {
      return `ssot_${globalThis.crypto.randomUUID()}`;
    }

    return `ssot_${Date.now()}_${Math.random().toString(36).slice(2, 10)}`;
  }

  async function findOntologyFrame() {
    const frames = await miro.board.get({ type: 'frame' });

    let frame = frames.find(
      item => (item.title ?? '').trim().toLowerCase() === ONTOLOGY_FRAME_NAME
    );

    if (frame) return frame;

    // Fallback: find a frame containing a child labelled "Ontology".
    for (const candidate of frames) {
      const children = await candidate.getChildren();

      const hasOntologyLabel = children.some(item => {
        if (item.type !== 'shape' && item.type !== 'text') return false;
        return plainText(item.content).toLowerCase() === ONTOLOGY_FRAME_NAME;
      });

      if (hasOntologyLabel) return candidate;
    }

    throw new Error('Ontology frame not found');
  }

  async function normalizeSources(ontologyShapes) {
    const sources = new Map();
    const sourceIdsInUse = new Set();
    let newSources = 0;
    let repairedSources = 0;
    let ignoredSources = 0;

    for (const source of ontologyShapes) {
      if (isEmpty(source)) continue;

      if (hasIgnorePrefix(source)) {
        ignoredSources++;
        continue;
      }

      const currentMeta = await source.getMetadata(SSOT_KEY);
      let entityId = currentMeta?.entity_id;

      // A copied canonical shape may carry the original source metadata.
      // Every canonical shape inside Ontology must own a unique entity_id.
      if (!entityId || sourceIdsInUse.has(entityId)) {
        entityId = createEntityId();
        newSources++;
      }

      sourceIdsInUse.add(entityId);

      const needsRepair =
        currentMeta?.entity_id !== entityId ||
        currentMeta?.role !== 'source' ||
        currentMeta?.field !== 'content';

      if (needsRepair) {
        await source.setMetadata(SSOT_KEY, {
          entity_id: entityId,
          field: 'content',
          role: 'source'
        });

        if (currentMeta?.entity_id) repairedSources++;
      }

      sources.set(entityId, source);
    }

    return {
      sources,
      newSources,
      repairedSources,
      ignoredSources
    };
  }

  function buildSourcesByText(sources) {
    const byText = new Map();

    for (const [entityId, source] of sources) {
      const text = plainText(source.content);
      if (!text) continue;

      const entries = byText.get(text) ?? [];
      entries.push({ entityId, source });
      byText.set(text, entries);
    }

    return byText;
  }

  async function bindReferences(allShapes, ontologyShapeIds, sources) {
    const sourcesByText = buildSourcesByText(sources);
    const references = [];

    let newReferences = 0;
    let repairedReferences = 0;
    let ambiguousReferences = 0;
    let orphanReferences = 0;

    for (const item of allShapes) {
      if (ontologyShapeIds.has(item.id)) continue;
      if (isEmpty(item) || hasIgnorePrefix(item)) continue;

      const meta = await item.getMetadata(SSOT_KEY);

      // Existing links always win over text matching. This keeps references
      // connected even after either side has been renamed.
      if (meta?.entity_id) {
        if (sources.has(meta.entity_id)) {
          const needsRepair =
            meta.role !== 'reference' || meta.field !== 'content';

          if (needsRepair) {
            await item.setMetadata(SSOT_KEY, {
              entity_id: meta.entity_id,
              field: 'content',
              role: 'reference'
            });
            repairedReferences++;
          }

          references.push({ item, entityId: meta.entity_id });
        } else {
          orphanReferences++;
        }

        continue;
      }

      const text = plainText(item.content);
      if (!text) continue;

      const candidates = sourcesByText.get(text) ?? [];

      if (candidates.length === 1) {
        const entityId = candidates[0].entityId;

        await item.setMetadata(SSOT_KEY, {
          entity_id: entityId,
          field: 'content',
          role: 'reference'
        });

        references.push({ item, entityId });
        newReferences++;
      } else if (candidates.length > 1) {
        ambiguousReferences++;
      }
    }

    return {
      references,
      newReferences,
      repairedReferences,
      ambiguousReferences,
      orphanReferences
    };
  }

  async function syncReferences(references, sources) {
    let updated = 0;

    for (const { item, entityId } of references) {
      const source = sources.get(entityId);
      if (!source) continue;

      if (item.content !== source.content) {
        item.content = source.content;
        await item.sync();
        updated++;
      }
    }

    return updated;
  }

  async function syncAll() {
    const ontologyFrame = await findOntologyFrame();
    const ontologyChildren = await ontologyFrame.getChildren();
    const ontologyShapes = ontologyChildren.filter(item => item.type === 'shape');
    const ontologyShapeIds = new Set(ontologyShapes.map(item => item.id));

    const allShapes = await miro.board.get({ type: 'shape' });

    const sourceResult = await normalizeSources(ontologyShapes);
    const referenceResult = await bindReferences(
      allShapes,
      ontologyShapeIds,
      sourceResult.sources
    );

    const updated = await syncReferences(
      referenceResult.references,
      sourceResult.sources
    );

    let message =
      `SSOT Sync complete · Sources: ${sourceResult.sources.size}` +
      ` · References: ${referenceResult.references.length}` +
      ` · New links: ${referenceResult.newReferences}` +
      ` · Updated: ${updated}`;

    if (sourceResult.ignoredSources) {
      message += ` · Ignored _: ${sourceResult.ignoredSources}`;
    }

    if (referenceResult.ambiguousReferences) {
      message += ` · Ambiguous: ${referenceResult.ambiguousReferences}`;
    }

    if (referenceResult.orphanReferences) {
      message += ` · Orphans: ${referenceResult.orphanReferences}`;
    }

    await miro.board.notifications.showInfo(message);
  }

  async function init() {
    await miro.board.ui.on('icon:click', async () => {
      try {
        await syncAll();
      } catch (error) {
        console.error('SSOT Sync failed:', error);
        await miro.board.notifications.showError(
          `SSOT Sync failed: ${error.message ?? 'Unknown error'}`
        );
      }
    });
  }

  init();
</script>
</body>
</html>
