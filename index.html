<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SSOT Sync</title>
  <script src="https://miro.com/app/static/sdk/v2/miro.js"></script>
</head>
<body>
<script>
  const SSOT_KEY = 'portfolio_ssot';

  const L0_ENTITIES = [
    ['gameplay_layer', 'Gameplay Layer'],
    ['booster_modifier_system', 'Booster / Modifier System'],
    ['automation_system', 'Automation System'],
    ['inventory_system', 'Inventory System'],
    ['primary_resource_acquisition_system', 'Primary Resource Acquisition System'],
    ['production_system', 'Production System'],
    ['demand_fulfillment_system', 'Demand & Fulfillment System'],
    ['purchase_system', 'Purchase System'],
    ['progression_system', 'Progression System'],
    ['collections_system', 'Collections System'],
    ['social_system', 'Social System'],
    ['competition_ranking_system', 'Competition & Ranking System'],
    ['monetization_layer', 'Monetization Layer'],
    ['commerce_system', 'Commerce System'],
    ['advertising_system', 'Advertising System'],
    ['liveops_layer', 'LiveOps Layer'],
    ['events_system', 'Events System'],
    ['developer_to_player_communication_system', 'Developer-to-Player Communication System'],
    ['engagement_reward_system', 'Engagement & Reward System'],
    ['platform_player_services_layer', 'Platform & Player Services Layer'],
    ['platform_player_services_system', 'Platform & Player Services System'],
    ['tutorial_guidance_layer', 'Tutorial & Guidance Layer'],
    ['tutorial_guidance_system', 'Tutorial & Guidance System']
  ];

  function plainText(content) {
    const div = document.createElement('div');
    div.innerHTML = content ?? '';
    return (div.textContent ?? '').replace(/\s+/g, ' ').trim();
  }

  async function findOntologyFrame() {
    const frames = await miro.board.get({ type: 'frame' });

    let frame = frames.find(
      item => (item.title ?? '').trim().toLowerCase() === 'ontology'
    );

    if (frame) return frame;

    // Fallback: find a frame that contains a child labelled "Ontology".
    for (const candidate of frames) {
      const children = await candidate.getChildren();

      const hasOntologyLabel = children.some(item => {
        if (item.type !== 'shape' && item.type !== 'text') return false;
        return plainText(item.content).toLowerCase() === 'ontology';
      });

      if (hasOntologyLabel) {
        return candidate;
      }
    }

    throw new Error('Ontology frame not found');
  }

  async function setupL0() {
    const ontologyFrame = await findOntologyFrame();
    const ontologyChildren = await ontologyFrame.getChildren();
    const ontologyShapes = ontologyChildren.filter(item => item.type === 'shape');

    const allShapes = await miro.board.get({ type: 'shape' });

    const missing = [];
    let sourcesBound = 0;
    let referencesBound = 0;

    for (const [entityId, canonicalName] of L0_ENTITIES) {
      const sourceCandidates = ontologyShapes.filter(
        item => plainText(item.content) === canonicalName
      );

      if (sourceCandidates.length !== 1) {
        missing.push(
          `${canonicalName} (${sourceCandidates.length} candidates in Ontology)`
        );
        continue;
      }

      const source = sourceCandidates[0];

      await source.setMetadata(SSOT_KEY, {
        entity_id: entityId,
        field: 'name',
        role: 'source'
      });

      sourcesBound++;

      for (const item of allShapes) {
        if (item.id === source.id) continue;
        if (plainText(item.content) !== canonicalName) continue;

        await item.setMetadata(SSOT_KEY, {
          entity_id: entityId,
          field: 'name',
          role: 'reference'
        });

        referencesBound++;
      }
    }

    if (missing.length) {
      throw new Error(
        `Setup incomplete. Missing/ambiguous canonical items: ${missing.join('; ')}`
      );
    }

    return { sourcesBound, referencesBound };
  }

  async function collectBindings() {
    const shapes = await miro.board.get({ type: 'shape' });

    const sources = new Map();
    const references = [];

    for (const item of shapes) {
      const meta = await item.getMetadata(SSOT_KEY);

      if (!meta?.entity_id || !meta?.field || !meta?.role) {
        continue;
      }

      const key = `${meta.entity_id}:${meta.field}`;

      if (meta.role === 'source') {
        sources.set(key, item);
      } else if (meta.role === 'reference') {
        references.push({ item, key });
      }
    }

    return { sources, references };
  }

  async function syncAll() {
    let { sources, references } = await collectBindings();
    let setupResult = null;

    if (sources.size < L0_ENTITIES.length) {
      setupResult = await setupL0();
      ({ sources, references } = await collectBindings());
    }

    let updated = 0;
    let missingSources = 0;

    for (const { item, key } of references) {
      const source = sources.get(key);

      if (!source) {
        missingSources++;
        continue;
      }

      if (item.content !== source.content) {
        item.content = source.content;
        await item.sync();
        updated++;
      }
    }

    let message;

    if (setupResult) {
      message =
        `SSOT setup complete · Sources: ${setupResult.sourcesBound}` +
        ` · References: ${setupResult.referencesBound}` +
        ` · Updated: ${updated}`;
    } else {
      message =
        `SSOT Sync complete · Sources: ${sources.size}` +
        ` · References: ${references.length}` +
        ` · Updated: ${updated}`;
    }

    if (missingSources) {
      message += ` · Missing sources: ${missingSources}`;
    }

    await miro.board.notifications.showInfo(message);
  }

  async function init() {
    await miro.board.ui.on('icon:click', async () => {
      try {
        await syncAll();
      } catch (error) {
        console.error('SSOT Sync failed:', error);
        await miro.board.notifications.showError(
          `SSOT Sync failed: ${error.message ?? 'Unknown error'}`
        );
      }
    });
  }

  init();
</script>
</body>
</html>
